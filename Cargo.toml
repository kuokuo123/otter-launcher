[package]
name = "otter-launcher"
version = "0.8.2"
edition = "2024"

[dependencies]
ratatui = "0.30.2"
image = "0.25.10"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm", "image-defaults"] }
ratatui-textarea = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
regex = "1.13.1"
hostname = "0.4.2"
urlencoding = "2.1.3"
fuzzy-matcher = "0.3.7"
ansi-to-tui = "8.0.1"
shellexpand = "3.1.2"
crossterm = "0.29.0"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
tempfile = "3.27.0"
terminal_size = "0.4.4"
unicode-width = "0.2.2"
rustix = { version = "1.1.5", features = ["process"] }
